spring.application.name=UserNotes

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SECRET_KEY}
supabase.bucket.profile=profile-images
supabase.bucket.item=uploaded-item-data

# MongoDB connection
spring.data.mongodb.database=${MONGO_DB}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# File upload settings
spring.servlet.multipart.max-file-size=50000MB
spring.servlet.multipart.max-request-size=50000MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true

# Redis (if you are using it for @Cacheable)
spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379

# Tomcat embedded server
server.tomcat.max-swallow-size=50000MB
server.tomcat.max-http-header-size=16KB
server.tomcat.threads.max=200
server.tomcat.accept-count=100
server.tomcat.max-http-post-size=524288000
server.servlet.session.timeout=30m

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=2592000000

# Performance & Logging
spring.main.lazy-initialization=true
spring.output.ansi.enabled=never
spring.devtools.restart.enabled=false
logging.level.root=INFO